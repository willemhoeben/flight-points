name: CI

on:
  push:
  pull_request:

# A later push makes an in-flight run on the same branch pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Matches packageManager in package.json. Pinned rather than
          # "latest" so a bun release cannot turn a green branch red
          # overnight without a commit explaining it.
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      # Lint and typecheck first: they are seconds, and they catch the
      # mistakes most likely to be in a diff.
      - run: bun run lint
      - run: bun run typecheck

      # The suite is free and finishes in about a second. Several of these
      # are invariant tripwires rather than unit tests — the palette contrast
      # ratios, the print palette, the stylesheet layer cascade, the CSP
      # shape, and the 404 boundary rule — and they are only worth having if
      # something runs them without being asked.
      - run: bun test

      # Last, because it is the slow one, and because a build that passes
      # tells you nothing a failing lint has not already told you.
      - run: bun run build
